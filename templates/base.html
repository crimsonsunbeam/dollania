<!DOCTYPE html>
<html lang="ru">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="{% block description %}Доллания — виртуальное государство.{% endblock %}" />

	<link rel="icon" type="image/png" href="/static/favicon-96x96.png" sizes="96x96" />
	<link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
	<link rel="shortcut icon" href="/static/favicon.ico" />
	<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png" />
	<meta name="apple-mobile-web-app-title" content="Dollania" />
	<link rel="manifest" href="/static/site.webmanifest" />

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet" />

	<link rel="stylesheet" href="/static/css/base.css" />
	<link rel="stylesheet" href="/static/css/layout.css" />
	<link rel="stylesheet" href="/static/css/components.css" />
	<link rel="stylesheet" href="/static/css/cube.css" />
	{% block styles %}{% endblock %}

	<title>{% block title %}Доллания{% endblock %}</title>
</head>

<body>

	<header class="site-header">
		<div class="header-inner">
			<a href="/" class="logo" aria-label="Доллания — на главную">
				<span class="logo-text">Доллания</span>
				<span class="logo-cube" aria-hidden="true">
					<span class="logo-cube__scene">
						<span class="logo-cube__inner">
							<span class="logo-cube__face logo-cube__face--front"></span>
							<span class="logo-cube__face logo-cube__face--back"></span>
							<span class="logo-cube__face logo-cube__face--right"></span>
							<span class="logo-cube__face logo-cube__face--left"></span>
							<span class="logo-cube__face logo-cube__face--top"></span>
							<span class="logo-cube__face logo-cube__face--bottom"></span>
						</span>
					</span>
				</span>
			</a>

			<details class="menu">
				<summary class="menu-toggle" aria-label="Открыть меню">
					<span class="menu-icon" aria-hidden="true"><span></span></span>
				</summary>

				<nav class="menu-list" aria-label="Основная навигация">
					<a href="/" {% if active == "index" %}class="active"{% endif %}>Главная</a>
					<a href="/history" {% if active == "history" %}class="active"{% endif %}>История</a>
					<a href="/symbols" {% if active == "symbols" %}class="active"{% endif %}>Символика</a>
					<a href="/links" {% if active == "links" %}class="active"{% endif %}>Ссылки</a>
					<a href="/passport" {% if active == "passport" %}class="active"{% endif %}>Паспорт</a>
				</nav>
			</details>
		</div>
	</header>

	<main class="site-main">
		{% block content %}{% endblock %}
	</main>

	<footer class="site-footer">
		<p>&copy; 2024&mdash;2026 Доллания. Все права защищены.</p>
		<p>
			<a href="https://vk.com/dollania" target="_blank" rel="noopener">ВКонтакте</a>
			&middot;
			<a href="/links">Все ссылки</a>
		</p>
	</footer>

	<script src="/static/js/main.js" defer></script>
	{% block scripts %}{% endblock %}

</body>

</html>
